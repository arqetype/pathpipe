services:
  # PostgreSQL
  db:
    image: postgres:17
    restart: always
    container_name: pathpipe-database
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${NEST_DATABASE_USER}
      POSTGRES_PASSWORD: ${NEST_DATABASE_PASS}
      POSTGRES_DB: ${NEST_DATABASE_NAME}
    networks:
      - app-network
    healthcheck:
      test:
        [
          'CMD',
          'pg_isready',
          '-U',
          '${NEST_DATABASE_USER}',
          '-d',
          '${NEST_DATABASE_NAME}',
        ]
      interval: 60s
      retries: 5
      start_period: 5s
      timeout: 10s

  # Redis (BullMQ)
  redis:
    image: redis:7-alpine
    restart: always
    container_name: pathpipe-redis
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redisdata:/data
    networks:
      - app-network
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping']
      interval: 60s
      retries: 5
      start_period: 5s
      timeout: 10s

  # API (Nest.js)
  api:
    container_name: pathpipe-api
    image: ghcr.io/${GITHUB_OWNER}/pathpipe-api:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      NODE_ENV: production
      NEST_PORT: ${NEST_PORT}
      NEST_DATABASE_HOST: ${NEST_DATABASE_HOST}
      NEST_DATABASE_PORT: ${NEST_DATABASE_PORT}
      NEST_DATABASE_USER: ${NEST_DATABASE_USER}
      NEST_DATABASE_PASS: ${NEST_DATABASE_PASS}
      NEST_DATABASE_NAME: ${NEST_DATABASE_NAME}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      NEST_JWT_SECRET: ${NEST_JWT_SECRET}
      NEST_JWT_EXPIRATION_TIME: ${NEST_JWT_EXPIRATION_TIME}
      NEST_FRONT_URL: ${NEST_FRONT_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      NEST_GITHUB_CLIENT_ID: ${NEST_GITHUB_CLIENT_ID}
      NEST_GITHUB_CLIENT_SECRET: ${NEST_GITHUB_CLIENT_SECRET}
      NEST_GITHUB_CALLBACK_URL: ${NEST_GITHUB_CALLBACK_URL}
      NEST_GOOGLE_CLIENT_ID: ${NEST_GOOGLE_CLIENT_ID}
      NEST_GOOGLE_CLIENT_SECRET: ${NEST_GOOGLE_CLIENT_SECRET}
      NEST_GOOGLE_CALLBACK_URL: ${NEST_GOOGLE_CALLBACK_URL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    expose:
      - '4000'
    networks:
      - app-network
      - dokploy-network
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health || exit 1']
      interval: 30s
      retries: 5
      start_period: 20s
      timeout: 10s

  # Web (Next.js)
  web:
    container_name: pathpipe-web
    image: ghcr.io/${GITHUB_OWNER}/pathpipe-web:${IMAGE_TAG:-latest}
    pull_policy: always
    environment:
      NEXT_API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST}
    depends_on:
      - api
    restart: always
    expose:
      - '3000'
    networks:
      - app-network
      - dokploy-network
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/ || exit 1']
      interval: 30s
      retries: 5
      start_period: 20s
      timeout: 10s

  # Worker - email queue
  worker-email:
    container_name: pathpipe-worker-email
    image: ghcr.io/${GITHUB_OWNER}/pathpipe-worker:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ['node', 'apps/worker/dist/index.js', 'email']
    environment:
      WORKERS_PORT: ${WORKERS_PORT}
      WORKERS_API_URL: http://api:4000
      WORKERS_API_KEY: ${WORKERS_API_KEY}
      WORKERS_REDIS_HOST: redis
      WORKERS_REDIS_PORT: ${REDIS_PORT}
      WORKERS_REDIS_PASSWORD: ${REDIS_PASSWORD}
      WORKERS_EMAIL_HOST: ${WORKERS_EMAIL_HOST}
      WORKERS_EMAIL_PORT: ${WORKERS_EMAIL_PORT}
      WORKERS_EMAIL_USER: ${WORKERS_EMAIL_USER}
      WORKERS_EMAIL_PASS: ${WORKERS_EMAIL_PASS}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - app-network

  # Worker - ATS queue
  worker-ats:
    container_name: pathpipe-worker-ats
    image: ghcr.io/${GITHUB_OWNER}/pathpipe-worker:${IMAGE_TAG:-latest}
    pull_policy: always
    command: ['node', 'apps/worker/dist/index.js', 'ats']
    environment:
      WORKERS_PORT: ${WORKERS_PORT}
      WORKERS_API_URL: http://api:4000
      WORKERS_API_KEY: ${WORKERS_API_KEY}
      WORKERS_REDIS_HOST: redis
      WORKERS_REDIS_PORT: ${REDIS_PORT}
      WORKERS_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - app-network

volumes:
  pgdata:
  redisdata:

networks:
  app-network:
    driver: bridge
  dokploy-network:
    external: true
