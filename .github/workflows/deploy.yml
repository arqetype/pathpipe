name: 'Deploy'
on:
  push:
    branches: [prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  quality-checks:
    name: Quality Checks
    uses: ./.github/workflows/build-lint-test.yml
    with:
      ref: ${{ github.sha }}
      node-version: '22'
      concurrency-group: build-lint-test-deploy-${{ github.ref }}

  build-api:
    name: Build & Push (api)
    needs: quality-checks
    uses: ./.github/workflows/build-image.yml
    with:
      app: api

  build-web:
    name: Build & Push (web)
    needs: quality-checks
    uses: ./.github/workflows/build-image.yml
    with:
      app: web
    secrets:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}

  build-worker:
    name: Build & Push (worker)
    needs: quality-checks
    uses: ./.github/workflows/build-image.yml
    with:
      app: worker

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-api, build-web, build-worker]
    steps:
      - name: Trigger Dokploy redeploy
        run: |
          curl --fail -X POST \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -H "accept: application/json" \
            -d '{"composeId": "${{ secrets.DOKPLOY_COMPOSE_ID }}"}' \
            "https://dokploy.clementomnes.dev/api/compose.deploy"
