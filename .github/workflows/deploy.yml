name: 'Deploy'
on:
  push:
    branches: [prod]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  quality-checks:
    name: Quality Checks
    uses: ./.github/workflows/build-lint-test.yml
    with:
      ref: ${{ github.sha }}
      node-version: '22'
      concurrency-group: build-lint-test-deploy-${{ github.ref }}

  build-and-push:
    name: Build & Push (${{ matrix.app }})
    runs-on: ubuntu-latest
    needs: quality-checks
    strategy:
      matrix:
        app: [api, web, worker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pathpipe-${{ matrix.app }}:latest
            ghcr.io/${{ github.repository_owner }}/pathpipe-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Trigger Dokploy redeploy
        run: |
          curl --fail -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
