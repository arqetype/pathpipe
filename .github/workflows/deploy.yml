name: 'Deploy'
on:
  push:
    branches: [prod]

# Cancel previous deployment runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-checks:
    name: Quality Checks
    uses: ./.github/workflows/build-lint-test.yml
    with:
      ref: ${{ github.sha }}
      node-version: '22'
      concurrency-group: build-lint-test-deploy-${{ github.ref }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production..."
          # Vos étapes de déploiement ici
