name: 'Build & Push Image'
on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
    secrets:
      NEXT_PUBLIC_API_URL:
        required: false
      NEXT_PUBLIC_POSTHOG_KEY:
        required: false
      NEXT_PUBLIC_POSTHOG_HOST:
        required: false

jobs:
  build:
    name: Build & Push (${{ inputs.app }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ inputs.app }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ inputs.app }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pathpipe-${{ inputs.app }}:latest
            ghcr.io/${{ github.repository_owner }}/pathpipe-${{ inputs.app }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          no-cache: true
