version: 2

updates:
  # Root-level configuration for pnpm workspace
  # This manages all dependencies across the entire monorepo
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: daily
      timezone: 'Europe/Paris'
      time: '09:00'
    labels:
      - 'dependabot'
      - 'dependencies'
      - 'monorepo'
    commit-message:
      include: scope
      prefix: 'chore'
    open-pull-requests-limit: 20
    groups:
      # Monorepo and build tools
      monorepo-tools:
        patterns:
          - 'turbo'
          - '@turbo/*'
          - 'pnpm'
          - 'concurrently'

      # TypeScript ecosystem
      typescript:
        patterns:
          - 'typescript'
          - '@types/*'
          - 'ts-node'
          - 'ts-jest'
          - 'ts-loader'
          - 'tsconfig-paths'
          - 'typescript-eslint'

      # React ecosystem
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
          - 'next'
          - 'next-themes'

      # NestJS ecosystem
      nestjs:
        patterns:
          - '@nestjs/*'
          - 'rxjs'
          - 'reflect-metadata'

      # Database and ORM
      database:
        patterns:
          - '@nestjs/typeorm'
          - 'typeorm'
          - 'pg'
          - '@types/pg'

      # Authentication
      authentication:
        patterns:
          - 'passport*'
          - '@nestjs/passport'
          - '@nestjs/jwt'
          - '@types/passport*'

      # HTTP and networking
      http:
        patterns:
          - '@nestjs/axios'
          - 'axios'
          - 'cookie-parser'
          - '@types/cookie-parser'
          - '@types/express'

      # Forms and validation
      forms:
        patterns:
          - 'react-hook-form'
          - 'class-transformer'
          - 'class-validator'
          - '@hookform/resolvers'
          - 'zod'

      # UI and styling
      ui:
        patterns:
          - '@radix-ui/*'
          - 'tailwindcss'
          - '@tailwindcss/*'
          - 'tailwind-merge'
          - 'tw-animate-css'
          - 'class-variance-authority'
          - 'clsx'
          - 'lucide-react'
          - 'input-otp'

      # Email
      email:
        patterns:
          - '@react-email/*'
          - 'nodemailer'
          - '@types/nodemailer'
          - 'maildev'

      # Testing
      testing:
        patterns:
          - '@testing-library/*'
          - 'jest'
          - '@jest/*'
          - '@types/jest'
          - 'jest-environment-jsdom'
          - 'supertest'
          - '@types/supertest'
          - '@nestjs/testing'

      # Code quality and linting
      code-quality:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'eslint-config-*'
          - 'eslint-plugin-*'
          - '@next/eslint-plugin-next'
          - 'prettier'
          - 'globals'

      # Analytics and monitoring
      analytics:
        patterns:
          - 'posthog-js'
          - 'posthog-node'

      # Build and development tools
      build-tools:
        patterns:
          - '@swc/*'
          - 'source-map-support'
          - '@turbo/gen'

      # Avatar generation
      avatar:
        patterns:
          - '@dicebear/*'
