opencollection: 1.0.0

info:
  name: api
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''

request:
  scripts:
    - type: before-request
      code: |-
        var existingToken = bru.getEnvVar('token') || bru.getVar('token');

        if (existingToken) {
          console.log('Using saved token');
          req.setHeader('Cookie', 'auth-token=' + existingToken);
        } else {
          console.log('No token. Set env var "token" manually or run login request first.');
          console.log('Token not set - request may fail');
        }
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
